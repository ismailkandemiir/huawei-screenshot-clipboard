name: Huawei Tablet Screenshot Clipboard APK Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./HuaweiScreenshotClipboard
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for Easy Download
        run: |
          cp HuaweiScreenshotClipboard/app/build/outputs/apk/debug/app-debug.apk Huawei_EkranGoruntusu_Kopyalayici.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Huawei-EkranGoruntusu-Kopyalayici-APK
          path: Huawei_EkranGoruntusu_Kopyalayici.apk
